services:
  news-brief:
    build: .
    image: personal-news-intelligence:0.2.0
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    command: ["run"]

  dashboard:
    build: .
    image: personal-news-intelligence:0.2.0
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    ports:
      - "8787:8787"
    command: ["serve", "--port", "8787"]
    restart: unless-stopped
